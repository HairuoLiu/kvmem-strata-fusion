[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kvmem-strata-fusion"
version = "0.1.0"
description = "Canonical Atom Store Architecture (CASA) & KVMem-Strata Hierarchical Caching Engine"
authors = [{name = "Hai & Antigravity Research Team"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
